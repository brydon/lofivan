<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#29291f">
  <title>lofivan</title>
  <meta name="description" content="Headphones on, the afternoon on repeat. Settle into an animated lofi room and explore its working retro computer.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='21' rx='4' fill='%23d4c398'/%3E%3Crect x='6' y='8' width='20' height='13' rx='2' fill='%232f5b49'/%3E%3Cpath d='M11 29h10M16 25v4' stroke='%23d4c398' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/background.png" as="image">
  <link rel="stylesheet" href="style.css">
  <script src="snake.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <main id="room" aria-label="A quiet illustrated coding room">
    <div id="world" class="world">
      <img class="room-art" src="assets/background.png" width="1672" height="941" alt="A sunlit illustrated workspace with exposed brick, trailing plants, books, and a wooden desk." fetchpriority="high">
      <div class="character-layer">
        <img class="ivan-art" src="assets/character.png" alt="Ivan in round glasses and headphones, using his heavily stickered laptop." draggable="false">
        <span class="park-sticker" aria-hidden="true"><img src="assets/quttinirpaaq-sticker.png" alt="" draggable="false"></span>
      </div>
      <div class="computer-rig">
        <img class="computer-layer" src="assets/computer.png" alt="A beige CRT monitor and keyboard beside an NVIDIA DGX Spark." draggable="false">
        <div class="screen-light" aria-hidden="true"></div>
        <section id="computer" class="monitor-terminal" aria-label="lofivan terminal">
          <div id="terminal-app" class="terminal-app terminal-on-screen">
            <div id="terminal-output" class="terminal-output" role="log" aria-label="Terminal output"></div>
            <form id="terminal-form" autocomplete="off"><label id="terminal-prompt" for="command">1vnzh@lofivan:~ $</label><input id="command" name="command" aria-label="Terminal command" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="500" enterkeyhint="send" inputmode="text"></form>
          </div>
          <div id="snake-game" class="snake-game" tabindex="0" role="group" aria-label="Snake game" aria-describedby="snake-controls" hidden>
            <div class="snake-heading"><span>snake</span><span id="snake-score">00</span></div>
            <div class="snake-board">
              <canvas width="192" height="120" role="img" aria-label="Snake playing field"></canvas>
              <div class="snake-message" role="status" aria-live="polite"></div>
            </div>
            <p id="snake-controls" class="snake-controls"><span class="snake-keys">arrows / wasd · space pause<br>q quit</span><span class="snake-touch">swipe · tap pause<br>hold to quit</span></p>
          </div>
          <div class="scanlines" aria-hidden="true"></div>
        </section>
      </div>
      <div class="dust" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="room-vignette" aria-hidden="true"></div>
    <p id="listen-hint" class="listen-hint">click to listen</p>
  </main>

  <div id="announcement" class="sr-only" aria-live="polite"></div>
  <audio id="radio" src="assets/afternoon-loop.mp3" autoplay loop preload="auto" aria-label="Original lofi instrumental music"></audio>
</body>
</html>
